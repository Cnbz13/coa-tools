name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version (x.y.z)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - name: Resolve version
        shell: pwsh
        run: |
          $version = '${{ inputs.version || github.ref_name }}'.TrimStart('v')
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run release
      - run: node scripts/validate-manifest.mjs dist/manifest.json
      - name: Test genuine EventAlert package end to end
        run: node scripts/verify-eventalert-package.mjs
      - name: Test Windows package end to end
        shell: powershell
        run: .\scripts\test-windows-package.ps1 -ZipPath "dist\CoAAddonManager-v${env:RELEASE_VERSION}-Windows.zip"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $hereticHelper = (Get-ChildItem "dist/CoAHereticHelper-v*.zip" | Select-Object -First 1).FullName
          $assets = @(
            "dist/CoAAddonManager-v$env:RELEASE_VERSION-Windows.zip",
            "dist/CoACombatAssistant-v$env:RELEASE_VERSION.zip",
            "dist/CoAUIManager-v$env:RELEASE_VERSION.zip",
            "dist/CoALootDecider-v$env:RELEASE_VERSION.zip",
            "dist/CoAMessageCenter-v$env:RELEASE_VERSION.zip",
            "dist/CoARotationGuide-v$env:RELEASE_VERSION.zip",
            "dist/CoADungeonNavigator-v$env:RELEASE_VERSION.zip",
            $hereticHelper,
            "dist/GridCoA-v$env:RELEASE_VERSION.zip",
            "dist/EventAlertCoA-v$env:RELEASE_VERSION.zip",
            'dist/SHA256SUMS.txt',
            'dist/manifest.json'
          )
          if (gh release view $tag 2>$null) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --generate-notes --target $env:GITHUB_SHA
          }
