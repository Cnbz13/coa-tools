name: Veille CoA hebdomadaire

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coa-watch-main
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: npm ci --ignore-scripts
      - name: Lire les sources officielles et produire les recommandations
        run: npm run watch:coa
      - name: Vérifier les parseurs et les règles d'impact
        run: npm test
      - name: Publier uniquement le rapport et l'état anti-doublon
        shell: bash
        run: |
          if git diff --quiet -- watch/state.json watch/report.json; then
            echo "Aucun changement de veille à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch/state.json watch/report.json
          git commit -m "chore: actualiser la veille CoA"
          git push origin HEAD:main
